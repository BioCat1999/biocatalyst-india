# Daily ingestion fallback for every registered source.
#
# Vercel Cron remains configured as the primary daily trigger. This workflow
# provides an independent, visible scheduler so stale feeds cannot go unnoticed
# when a platform cron stops firing. Each source runs separately and sequentially
# to stay within serverless execution limits and reduce database contention.
name: ingest-all-daily

on:
  # Also run when this workflow itself changes, so a scheduler repair can
  # be validated immediately without needing a personal API token.
  push:
    branches: [main]
    paths: [".github/workflows/ingest-all-daily.yml"]
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # GDELT is a best-effort enrichment source. Keep attempting it daily, but
    # do not fail the entire feed-health workflow when its upstream is down.
    continue-on-error: ${{ matrix.source == 'gdelt' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        source:
          - ctgov
          - press-rss
          - prnewswire
          - openfda
          - pubmed
          - sebi-rss
          - mhra-rss
          - ema-rss
          # GDELT is the least reliable upstream and may consume the full
          # request timeout, so run it last instead of blocking fresher feeds.
          - gdelt
    steps:
      - name: Ingest ${{ matrix.source }}
        run: |
          curl --fail-with-body -sS --retry 2 --retry-all-errors --max-time 600 -X POST \
            "https://biocatalyst-india.vercel.app/api/v1/admin/ingestion/run?source=${{ matrix.source }}" \
            -H "Authorization: Bearer ${{ secrets.ADMIN_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{}'
